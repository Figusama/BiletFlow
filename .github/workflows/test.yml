name: test
on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: biletflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql://test:test@localhost:5432/biletflow_test
      EMAIL_API: ${{ secrets.EMAIL_API }}
      APP_URL: http://localhost:8000
      MAIL_FROM: BiletFlow <onboarding@resend.dev>
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python create_tables.py
      - run: pytest -v backend/tests/test_auth.py
      - run: pytest -v backend/tests/test_users.py
      - run: pytest -v backend/tests/test_events.py
      - run: pytest -v backend/tests/test_orders.py
      - run: pytest -v backend/tests/test_payments.py
      - run: pytest -v backend/tests/test_tickets.py
      - run: pytest -v backend/tests/test_admin.py