services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: biletflow
      POSTGRES_PASSWORD: biletflow
      POSTGRES_DB: biletflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biletflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://biletflow:biletflow@db:5432/biletflow
      SQL_ECHO: "false"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      WORKERS_ENABLED: "true"
      MEDIA_ROOT: /app/media
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
